name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  APP_NAME: PetDesktop
  PACKAGE_NAME: org.pet.desktop
  # freetype 必须与 p4a 内置 recipe 的 version 一致，否则源码对不上
  FREETYPE_VERSION: '2.14.1'

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev automake libltdl-dev patch wget curl

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cython==0.29.36 buildozer python-for-android

      - name: Cache buildozer and packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.cache/buildozer
            ~/.local/share/python-for-android
          key: p4a-v7-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            p4a-v7-
            p4a-v6-

      # ---------------------------------------------------------------
      # 核心修复：p4a 内置的 freetype recipe 从 download.savannah.gnu.org
      # 拉源码，该地址在 CI 上稳定返回 502（重试 5 次全部失败），导致
      # `p4a create` 直接挂掉。
      #
      # p4a 的 Recipe.download_if_necessary() / unpack() 都会读取
      #     P4A_<recipe名小写>_DIR
      # 一旦设置：跳过下载，并在 unpack 时把该目录 cp -a 到构建目录。
      # 因此这里预先从可用镜像下载官方 release tarball（含预生成的
      # ./configure，freetype recipe 是靠 autotools 构建的，git tag 源码包
      # 没有 configure，不能用）并解压，然后把目录喂给 p4a。
      # ---------------------------------------------------------------
      - name: Stage freetype source (bypass savannah 502)
        run: |
          set -euo pipefail
          FT_FILE="freetype-${FREETYPE_VERSION}.tar.gz"
          SRC="$RUNNER_TEMP/freetype-src"
          TGZ="$RUNNER_TEMP/$FT_FILE"
          rm -rf "$SRC" "$TGZ"
          mkdir -p "$SRC"

          MIRRORS=(
            "https://download-mirror.savannah.gnu.org/releases/freetype/$FT_FILE"
            "https://mirror.csclub.uwaterloo.ca/nongnu/freetype/$FT_FILE"
            "https://downloads.sourceforge.net/project/freetype/freetype2/${FREETYPE_VERSION}/$FT_FILE"
            "https://download.savannah.gnu.org/releases/freetype/$FT_FILE"
          )

          got=0
          for u in "${MIRRORS[@]}"; do
            echo "== trying $u"
            if curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
                 --max-time 300 -o "$TGZ" "$u"; then
              if tar tzf "$TGZ" >/dev/null 2>&1; then
                echo "   OK: $(du -h "$TGZ" | cut -f1)"
                got=1
                break
              fi
              echo "   -> 下到的不是合法 gzip 包，换下一个镜像"
            fi
          done

          if [ "$got" != 1 ]; then
            echo "::error::无法获取 freetype 源码，所有镜像均失败"
            exit 1
          fi

          tar xzf "$TGZ" -C "$SRC" --strip-components=1
          if [ ! -f "$SRC/configure" ]; then
            echo "::error::解压后的 freetype 目录缺少 ./configure"
            exit 1
          fi
          chmod +x "$SRC/configure"

          # p4a 读的是小写名（recipe.py: environ.get('P4A_{}_DIR'.format(self.name.lower()))），
          # 大写形式一起设上，兼容不同 p4a 版本。
          {
            echo "P4A_freetype_DIR=$SRC"
            echo "P4A_FREETYPE_DIR=$SRC"
          } >> "$GITHUB_ENV"

          echo "=== staged freetype @ $SRC ==="
          ls "$SRC" | head -20

      - name: Build APK (Debug) with retries
        run: |
          set -o pipefail
          P4A_REPO=".buildozer/android/platform/python-for-android"

          # 失败重试时的兜底：把 p4a 里已知不稳定的下载源改到镜像。
          # 主修复是上面的 P4A_freetype_DIR，这里只是防止别的 recipe 也抽风。
          patch_p4a_sources() {
            if [ ! -d "$P4A_REPO/pythonforandroid/recipes" ]; then
              echo "p4a 尚未克隆，跳过补丁"
              return 0
            fi
            echo "=== 把 p4a 里的 savannah 源替换为镜像 ==="
            grep -rl "download\.savannah\.gnu\.org" "$P4A_REPO/pythonforandroid/recipes" 2>/dev/null \
              | while read -r f; do
                  sed -i 's#https://download\.savannah\.gnu\.org/releases#https://download-mirror.savannah.gnu.org/releases#g' "$f"
                  echo "  patched: $f"
                done || true
          }

          echo "Starting APK build..."
          MAX_RETRIES=3
          RETRY=0

          while [ $RETRY -lt $MAX_RETRIES ]; do
            echo ""
            echo "=========================================="
            echo "Build attempt $((RETRY+1))/$MAX_RETRIES"
            echo "=========================================="

            yes | buildozer android debug 2>&1 | tee "build_${RETRY}.log"
            EXIT_CODE=${PIPESTATUS[1]}

            if [ "$EXIT_CODE" -eq 0 ]; then
              echo "=========================================="
              echo "BUILD SUCCESS!"
              echo "=========================================="
              ls -lh bin/*.apk
              exit 0
            fi

            RETRY=$((RETRY+1))

            if [ $RETRY -lt $MAX_RETRIES ]; then
              echo "Build attempt $RETRY failed (exit code $EXIT_CODE)"
              echo "Last 40 lines:"
              tail -40 "build_$((RETRY-1)).log" || true
              patch_p4a_sources
              echo "Retrying in 60 seconds..."
              sleep 60
            fi
          done

          echo "=========================================="
          echo "BUILD FAILED after $MAX_RETRIES attempts"
          echo "=========================================="
          tail -200 "build_$((MAX_RETRIES-1)).log" || true
          exit 1
        timeout-minutes: 240

      - name: Verify APK
        run: |
          echo "=== Build output ==="
          ls -la bin/ 2>/dev/null || echo "bin/ not found"
          if [ -n "$(find bin/ -name '*.apk' -type f 2>/dev/null)" ]; then
            echo "=== SUCCESS: APK found! ==="
            for apk in bin/*.apk; do
              echo "  $apk ($(du -h "$apk" | cut -f1))"
            done
          else
            echo "=== FAILED: No APK generated ==="
            exit 1
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pet-app-debug-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build_*.log
          if-no-files-found: ignore
