name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  APP_NAME: PetDesktop
  PACKAGE_NAME: org.pet.desktop

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            libltdl-dev \
            patch

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cython==0.29.36
          pip install buildozer python-for-android

      - name: Cache buildozer and packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.cache/buildozer
            ~/.local/share/python-for-android
          key: p4a-v4-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            p4a-v4-

      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true
          echo "SDK licenses accepted"

      - name: Build APK (Debug) with retries
        run: |
          echo "Starting APK build..."
          set +e
          MAX_RETRIES=3
          RETRY=0
          while [ $RETRY -lt $MAX_RETRIES ]; do
            echo "=== Build attempt $((RETRY+1))/$MAX_RETRIES ==="
            yes | buildozer android debug 2>&1 | tee build.log
            EXIT_CODE=${PIPESTATUS[0]}
            if [ $EXIT_CODE -eq 0 ]; then
              echo "Build successful!"
              exit 0
            fi
            RETRY=$((RETRY+1))
            if [ $RETRY -lt $MAX_RETRIES ]; then
              echo "Build failed (exit code $EXIT_CODE), retrying in 30 seconds..."
              tail -30 build.log
              sleep 30
            fi
          done
          echo "Build failed after $MAX_RETRIES attempts"
          echo "=== Last 200 lines of final build log ==="
          tail -200 build.log
          exit 1
        timeout-minutes: 120

      - name: Find APK files
        run: |
          echo "Looking for APK files..."
          find bin/ -name "*.apk" -type f 2>/dev/null || echo "No APK found in bin/"
          ls -la bin/ 2>/dev/null || echo "bin/ directory not found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pet-app-debug-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
